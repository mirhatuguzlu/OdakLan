<!DOCTYPE html>
<html lang="tr">
<head>
  <!-- Replaced by `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OdakLan — Kaydırma. Odaklan. Şehrini kur.</title>
  <meta name="description" content="OdakLan, telefona dokunmadan geçirdiğin her dakikayı oyuna çeviren bir odak RPG'si. Arkadaşlarınla Odak Klanı kur, birlikte odaklan.">
  <meta name="theme-color" content="#0B0B14">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <meta property="og:type" content="website">
  <meta property="og:title" content="OdakLan — Kaydırma. Odaklan. Şehrini kur.">
  <meta property="og:description" content="Odaklandığın her dakika neon şehrini büyütür. Biri TikTok'a dalarsa klanın kalesi hasar alır.">
  <meta property="og:locale" content="tr_TR">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OdakLan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0B0B14; }
    #splash {
      position: fixed; inset: 0; display: grid; place-items: center;
      font: 900 40px system-ui, sans-serif; letter-spacing: -1px;
      background: linear-gradient(90deg, #00F0FF, #8B5CFF, #FF2E88);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: pulse 1.4s ease-in-out infinite alternate;
    }
    @keyframes pulse { from { opacity: .4 } to { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { #splash { animation: none } }
    #load-error {
      display: none; position: fixed; inset: auto 16px 15vh; text-align: center;
      font: 16px/1.5 system-ui, sans-serif; color: #8A8AA3;
    }
    #load-error.show { display: block; }
    #load-error code { color: #00F0FF; }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">OdakLan</div>
  <div id="load-error" role="alert"></div>
  <!-- Crawlers and no-JS visitors still get the pitch. -->
  <noscript>
    <h1>OdakLan — Kaydırma. Odaklan. Şehrini kur.</h1>
    <p>Telefona dokunmadan geçirdiğin her dakika sana Enerji kazandırır. Arkadaşlarınla Odak Klanı kur; biri sosyal medyaya dalarsa ortak kale hasar alır.</p>
  </noscript>
  <script>
    (() => {
      const splash = document.getElementById('splash');
      const error = document.getElementById('load-error');
      let loaded = false;
      // Never leave the splash pulsing forever: stop it and explain.
      const fail = (html) => {
        if (loaded) return;
        splash.style.animation = 'none';
        error.innerHTML = html;
        error.classList.add('show');
      };
      window.addEventListener('flutter-first-frame', () => {
        loaded = true;
        splash.remove();
        error.remove();
      });
      if (location.protocol === 'file:') {
        // Browsers block Flutter's JS/Wasm loading from file:// URLs.
        fail('Bu sayfa dosyadan açılamaz. Proje klasöründe ' +
             '<code>cd site &amp;&amp; flutter run -d chrome</code> çalıştırın.');
        return;
      }
      setTimeout(() => fail('Site yüklenemedi. Sayfayı yenilemeyi deneyin.'), 15000);
      window.addEventListener('error', (e) => {
        if (e.target instanceof HTMLScriptElement) {
          fail('Site dosyaları yüklenemedi. Sayfayı yenilemeyi deneyin.');
        }
      }, true);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
